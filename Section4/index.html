<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Course Task Manager</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header class="header">
    <h1>Course Task Manager</h1>
    <p>Track your courses from active to finished.</p>
  </header>

  <main class="container">

    <!-- Course Form -->
    <section class="form-section">

      <h2>Add Course</h2>

      <form id="courseForm">

        <div class="form-group">
          <label for="courseName">
            Course Name
          </label>

          <input type="text" id="courseName" placeholder="e.g. TypeScript" required>
        </div>

        <div class="form-group">
          <label for="courseDescription">
            Description
          </label>

          <textarea id="courseDescription" placeholder="What do you want to learn?" required></textarea>
        </div>

        <div class="form-group">
          <label for="courseDuration">
            Duration
          </label>

          <input type="text" id="courseDuration" placeholder="e.g. 2 weeks" required>
        </div>

        <button type="submit" id="addCourseBtn">
          Add Course
        </button>

      </form>

    </section>


    <!-- Task Lists -->
    <section class="tasks-section">

      <!-- Active Tasks -->
      <div class="task-column" id="activeTasks">

        <div class="column-header">
          <h2>Active Tasks</h2>
          <span id="activeCount">0</span>
        </div>

        <div class="task-list" id="activeTaskList">
          <!-- Tasks will be added here -->
        </div>

      </div>


      <!-- Finished Tasks -->
      <div class="task-column finished" id="finishedTasks">

        <div class="column-header">
          <h2>Finished Tasks</h2>
          <span id="finishedCount">0</span>
        </div>

        <div class="task-list" id="finishedTaskList">
          <!-- Finished tasks will be added here -->
        </div>

      </div>

    </section>

  </main>

  <script type="module" src="./dist/app.js"></script>
</body>

</html>
